name: PHP Lint

on:
  push:
    branches: [ 8 ]
  pull_request:
    branches: [ 8 ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint all PHP files
        run: |
          find . -name "*.php" -exec php -l {} +
